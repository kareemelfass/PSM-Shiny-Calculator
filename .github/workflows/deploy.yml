# Builds the Shiny app into a static Shinylive site (R runs in the visitor's browser via WebAssembly)
# and publishes it to GitHub Pages on every push to main.
name: Deploy Shinylive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages needed to build the site
        run: |
          install.packages(c("shinylive", "shiny", "bslib", "survival", "ggplot2", "flexsurv", "writexl"))
        shell: Rscript {0}

      - name: Copy app without tests and raw-data scripts
        run: |
          mkdir build
          cp -r app/. build/
          rm -rf build/tests build/data-raw

      - name: Export Shinylive site
        run: shinylive::export("build", "site")
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
